<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome to the Formula Edenia Championship - Results Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2ef;--card:#fff;--tx:#14141a;--mut:#6a6a72;--bd:#e2e2dc;--ac:#e10600;--gold:#c9a227;--silv:#9aa0a6;--bron:#b0723a}
@media (prefers-color-scheme:dark){:root{--bg:#0c0c0f;--card:#17171c;--tx:#f1f1f3;--mut:#9b9ba4;--bd:#2a2a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:800px;margin:0 auto;padding:16px 16px 40px}
h1,h2,.pos{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase}
.chq{height:16px;margin:0 -16px 18px;background:repeating-conic-gradient(var(--tx) 0 25%,transparent 0 50%) 0 0/16px 16px}
.kick{color:var(--ac);font-weight:600;letter-spacing:3px;font-size:12px;text-transform:uppercase}
h1{font-size:clamp(34px,9vw,58px);line-height:.95;margin:4px 0 8px}
h1::after{content:"";display:block;width:90px;height:6px;background:var(--ac);margin-top:12px;transform:skewX(-25deg)}
h2{font-size:19px;margin:28px 0 10px;letter-spacing:1.5px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:5px;height:20px;background:var(--ac);transform:skewX(-20deg)}
.sub{color:var(--mut);font-size:14px}
.gfx{width:100%;height:auto;display:block;border-radius:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:600}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.pos{width:44px;font-size:20px;text-align:center}
.pos.p1{color:var(--gold)}.pos.p2{color:var(--silv)}.pos.p3{color:var(--bron)}
.who{display:flex;align-items:center;gap:10px}
.sw{width:5px;height:28px;border-radius:2px;flex:none}
.who small{display:block;color:var(--mut);font-size:12px;line-height:1.1}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;padding:0 12px 12px}
summary{padding:12px 0;cursor:pointer;font-weight:600}
.empty{color:var(--mut);padding:18px;background:var(--card);border:1px solid var(--bd);border-radius:10px}
</style>
</head>
<body>
<main><div id="app"><div class="empty">Loading...</div></div></main>
<script>
var S,$=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tc(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return"hsl("+h+",72%,50%)"}

function resSVG(rn){
 var R=rn.results,W=1000,top=170,rh=40,H=top+R.length*rh+70,o='';
 o+='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="Arial Narrow,Arial,Helvetica,sans-serif" font-weight="700" font-style="italic"><rect width="'+W+'" height="'+H+'" fill="#0c0c0f"/>';
 for(var i=0;i<72;i++)for(var j=0;j<2;j++)if((i+j)%2===0)o+='<rect x="'+i*14+'" y="'+j*7+'" width="14" height="7" fill="#f1f1f3"/>';
 o+='<polygon points="40,46 190,46 172,106 22,106" fill="#e10600"/><text x="106" y="90" text-anchor="middle" font-size="34" fill="#fff">ROUND '+rn.no+'</text>';
 o+='<text x="215" y="80" font-size="40" fill="#fff">'+esc(rn.name.toUpperCase())+'</text><text x="215" y="108" font-size="20" font-weight="400" fill="#9b9ba4">'+esc(S.cfg.series)+' - '+rn.laps+' LAPS</text>';
 o+='<g font-size="14" font-weight="400" fill="#9b9ba4"><text x="50" y="152" text-anchor="end">POS</text><text x="82" y="152">DRIVER</text><text x="810" y="152" text-anchor="end">GAP</text><text x="960" y="152" text-anchor="end">PTS</text></g>';
 R.forEach(function(r,i){var y=top+i*rh;
  o+='<rect y="'+y+'" width="'+W+'" height="'+rh+'" fill="'+(i%2?'#121216':'#17171c')+'"/><rect x="62" y="'+(y+6)+'" width="6" height="'+(rh-12)+'" fill="'+tc(r.team)+'"/>';
  o+='<text x="50" y="'+(y+28)+'" text-anchor="end" font-size="24" fill="'+(i<3?['#c9a227','#9aa0a6','#b0723a'][i]:'#fff')+'">'+r.pos+'</text>';
  o+='<text x="82" y="'+(y+28)+'" font-size="22" fill="#fff">'+esc(r.name.toUpperCase())+'</text><text x="320" y="'+(y+27)+'" font-size="15" font-weight="400" fill="#9b9ba4">'+esc(r.team.toUpperCase())+'</text>';
  o+='<text x="810" y="'+(y+27)+'" text-anchor="end" font-size="20" font-weight="400" fill="'+(r.dnf?'#e10600':'#fff')+'">'+esc(r.gap)+'</text><text x="960" y="'+(y+28)+'" text-anchor="end" font-size="22" fill="#e10600">'+(r.pts?'+'+r.pts:'')+'</text>';
 });
 var fl=(rn.fl||"").replace(/[^\x20-\x7E]/g,"").trim().toUpperCase();
 o+='<text x="40" y="'+(H-26)+'" font-size="18" fill="#fff">'+esc(fl)+'</text><text x="960" y="'+(H-26)+'" text-anchor="end" font-size="16" fill="#e10600">'+esc(S.cfg.series)+'</text></svg>';
 return o;
}
function gfx(rn,el){
 var u="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(resSVG(rn));el.src=u;
 var im=new Image();
 im.onload=function(){try{var c=document.createElement("canvas");c.width=im.width*2;c.height=im.height*2;var x=c.getContext("2d");x.scale(2,2);x.drawImage(im,0,0,im.width,im.height);el.src=c.toDataURL("image/png")}catch(e){}};
 im.src=u;
}
function tables(){
 var d={},t={};
 S.rounds.forEach(function(rn){rn.results.forEach(function(r){
  var e=d[r.name]=d[r.name]||{team:r.team,pts:0,wins:0,pod:0};
  e.pts+=r.pts;if(!r.dnf&&r.pos===1)e.wins++;if(!r.dnf&&r.pos<=3)e.pod++;
  t[r.team]=(t[r.team]||0)+r.pts;
 })});
 return{d:d,t:t};
}
function render(){
 var h='<div class="chq"></div><div class="kick">Results</div><h1>'+esc(S.cfg.series)+'</h1>';
 if(!S.rounds.length){$("app").innerHTML=h+'<div class="empty">No races yet. Check back after the first round.</div>';return}
 var last=S.rounds[S.rounds.length-1],x=tables();
 h+='<div class="sub">After round '+S.rounds.length+' &middot; '+esc(last.name)+' &middot; won by <b>'+esc(last.results[0].name)+'</b></div>';
 h+='<h2>Latest result</h2><img class="gfx" id="gx'+last.no+'" alt="Round '+last.no+' results">';
 var dr=Object.keys(x.d).sort(function(a,b){var A=x.d[a],B=x.d[b];return B.pts-A.pts||B.wins-A.wins||B.pod-A.pod});
 h+='<h2>Drivers</h2><div class="card"><table><tr><th class="n">Pos</th><th>Driver</th><th class="n">Wins</th><th class="n">Pts</th></tr>';
 dr.forEach(function(n,i){var e=x.d[n];h+='<tr><td class="pos'+(i<3?' p'+(i+1):'')+'">'+(i+1)+'</td><td><div class="who"><span class="sw" style="background:'+tc(e.team)+'"></span><div>'+esc(n)+'<small>'+esc(e.team)+'</small></div></div></td><td class="n">'+e.wins+'</td><td class="n"><b>'+e.pts+'</b></td></tr>'});
 h+='</table></div>';
 var tn=Object.keys(x.t).sort(function(a,b){return x.t[b]-x.t[a]});
 h+='<h2>Constructors</h2><div class="card"><table><tr><th class="n">Pos</th><th>Team</th><th class="n">Pts</th></tr>';
 tn.forEach(function(n,i){h+='<tr><td class="pos'+(i<3?' p'+(i+1):'')+'">'+(i+1)+'</td><td><div class="who"><span class="sw" style="background:'+tc(n)+'"></span>'+esc(n)+'</div></td><td class="n"><b>'+x.t[n]+'</b></td></tr>'});
 h+='</table></div>';
 if(S.rounds.length>1){
  h+='<h2>Earlier rounds</h2>';
  S.rounds.slice(0,-1).reverse().forEach(function(rn){h+='<details><summary>Round '+rn.no+': '+esc(rn.name)+' - won by '+esc(rn.results[0].name)+'</summary><img class="gfx" id="gx'+rn.no+'" alt="Round '+rn.no+' results"></details>'});
 }
 $("app").innerHTML=h;
 S.rounds.forEach(function(rn){var im=$("gx"+rn.no);if(im)gfx(rn,im)});
}
fetch("season.json?"+Date.now()).then(function(r){return r.json()}).then(function(d){S=d;render()})
 .catch(function(){$("app").innerHTML='<div class="empty">Couldn\'t load season.json. Make sure it sits next to index.html, and open this through the GitHub Pages link, not by double-clicking the file.</div>'});
</script>
</body>
</html>
